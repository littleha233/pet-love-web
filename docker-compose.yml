version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: petlove-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-petlove}
      POSTGRES_USER: ${DB_USERNAME:-petlove}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-petlove}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - petlove_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-petlove} -d ${DB_NAME:-petlove}"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: petlove-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - petlove_minio_data:/data

volumes:
  petlove_pg_data:
  petlove_minio_data:
