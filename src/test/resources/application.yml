spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  datasource:
    url: jdbc:mysql://${TEST_DB_HOST:127.0.0.1}:${TEST_DB_PORT:3306}/${TEST_DB_NAME:pet_platform_test}?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false&createDatabaseIfNotExist=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${TEST_DB_USERNAME:root}
    password: ${TEST_DB_PASSWORD:Littleha233!}
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  flyway:
    enabled: true
  thymeleaf:
    check-template-location: false

app:
  auth:
    jwt-secret: "test-secret-key-for-phase0-need-at-least-32-bytes"
    access-token-seconds: 120
    refresh-token-seconds: 3600
    otp-ttl-seconds: 300
    otp-resend-seconds: 1
    mock-otp-enabled: true
    sms:
      enabled: true
      provider: mock
      sign-name: PetLoveTest
      template-login-code: LOGIN_CODE_TEST
      code-ttl-seconds: 300
      code-length: 6
      cooldown-seconds: 60
      daily-limit-per-mobile: 10
      daily-limit-per-ip: 30
      max-attempts: 5
      hash-pepper: test-sms-pepper
      expose-mock-code-in-response: true
      mock-code: "123456"
  storage:
    type: local
    local-root: ./target/test-uploads
    max-file-size-bytes: 10485760
    base-url: /api/v1/files/content
  bootstrap:
    admin-username: admin
    admin-password: Admin@123456
    admin-display-name: 系统管理员
