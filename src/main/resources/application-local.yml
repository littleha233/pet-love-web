spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:petlove}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME:petlove}
    password: ${DB_PASSWORD:petlove}
  jpa:
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  h2:
    console:
      enabled: false
