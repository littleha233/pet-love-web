spring:
  application:
    name: pet-love-web
  autoconfigure:
    exclude:
      - org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3307}/${DB_NAME:pet_platform}?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:Littleha233!}
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 12MB
      max-request-size: 12MB
  thymeleaf:
    check-template-location: false

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} [reqId=%X{requestId}] - %msg%n"

app:
  auth:
    jwt-secret: "pet-love-web-phase0-secret-key-change-in-production"
    access-token-seconds: 1800
    refresh-token-seconds: 604800
    otp-ttl-seconds: 300
    otp-resend-seconds: 60
    mock-otp-enabled: true
  storage:
    type: local
    local-root: ./uploads
    max-file-size-bytes: 10485760
    base-url: /api/v1/files/content
  bootstrap:
    admin-username: admin
    admin-password: Admin@123456
    admin-display-name: 系统管理员

server:
  port: 8080
